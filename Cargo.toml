[package]
name = "rusty-crunch"
version = "0.4.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.11", default-features = false }
console = "0.15"
walkdir = "2.5"
anyhow = "1.0"
rayon = "1.10"
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"


[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

[[bin]]
name = "rusty-crunch"
path = "src/main.rs"
